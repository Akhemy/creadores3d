name: Actualizar fotos y reseñas de Google Maps

on:
  schedule:
    # Días 1 y 26 de cada mes a las 10:00 UTC (~25 días entre runs)
    - cron: '0 10 1,26 * *'
  workflow_dispatch: # permite correrlo manualmente desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener datos de Google Places
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/fetch-places.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/google-places.json img/google-photos/
          git diff --staged --quiet || (
            git commit -m "chore: actualizar fotos y reseñas de Google Maps" &&
            git push
          )
